<!doctype html>
<html lang="my">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>For You 🥺💖</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Padauk (Burmese) & Nunito -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Padauk:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <style>
      body {
        font-family: "Nunito", "Padauk", sans-serif;
        margin: 0;
        padding: 0;
        overflow: hidden;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }

      /* 1. Live Animated Pastel Background */
      .live-bg {
        background: linear-gradient(
          -45deg,
          #ff9a9e,
          #fad0c4,
          #e0c3fc,
          #8ec5fc,
          #fbc2eb
        );
        background-size: 400% 400%;
        animation: gradientFlow 12s ease infinite;
      }

      @keyframes gradientFlow {
        0% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
        100% {
          background-position: 0% 50%;
        }
      }

      /* Ambient Glowing Bokeh Orbs */
      .bokeh-orb {
        position: absolute;
        border-radius: 50%;
        filter: blur(50px);
        opacity: 0.55;
        animation: floatOrb 14s infinite ease-in-out alternate;
        pointer-events: none;
        z-index: 0;
      }

      @keyframes floatOrb {
        0% {
          transform: translate(0, 0) scale(1);
        }
        50% {
          transform: translate(35px, -50px) scale(1.15);
        }
        100% {
          transform: translate(-25px, 35px) scale(0.95);
        }
      }

      /* Sticker Animations */
      .sticker-bounce {
        animation: cuteBounce 2.2s infinite ease-in-out;
      }

      @keyframes cuteBounce {
        0%,
        100% {
          transform: translateY(0) rotate(0deg);
        }
        25% {
          transform: translateY(-8px) rotate(-3deg);
        }
        75% {
          transform: translateY(-4px) rotate(3deg);
        }
      }

      .sticker-sassy {
        animation:
          sassyPop 0.55s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards,
          sassyWiggle 1.8s infinite ease-in-out 0.55s;
      }

      @keyframes sassyPop {
        0% {
          transform: scale(0.3) rotate(-18deg);
          opacity: 0;
        }
        70% {
          transform: scale(1.15) rotate(6deg);
          opacity: 1;
        }
        100% {
          transform: scale(1) rotate(0deg);
          opacity: 1;
        }
      }

      @keyframes sassyWiggle {
        0%,
        100% {
          transform: rotate(-3deg) translateY(0);
        }
        50% {
          transform: rotate(4deg) translateY(-6px);
        }
      }

      /* Button Transitions & Shake */
      #yes-btn {
        transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        box-shadow: 0 8px 20px rgba(244, 63, 94, 0.35);
      }

      #yes-btn:hover {
        box-shadow: 0 12px 26px rgba(244, 63, 94, 0.5);
        filter: brightness(1.06);
      }

      #no-btn {
        transition: all 0.25s ease;
      }

      .shake {
        animation: gentleShake 0.4s ease-in-out;
      }

      @keyframes gentleShake {
        0%,
        100% {
          transform: translateX(0);
        }
        25% {
          transform: translateX(-7px);
        }
        50% {
          transform: translateX(7px);
        }
        75% {
          transform: translateX(-4px);
        }
      }

      /* Floating Background Particles Layer */
      #bg-particles-layer {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 1;
        overflow: hidden;
      }

      .floating-particle {
        position: absolute;
        bottom: -40px;
        pointer-events: none;
        animation: floatUp linear forwards;
      }

      @keyframes floatUp {
        0% {
          transform: translateY(0) translateX(0) rotate(0deg);
          opacity: 0;
        }
        15% {
          opacity: 0.85;
        }
        85% {
          opacity: 0.85;
        }
        100% {
          transform: translateY(-110vh) translateX(var(--drift, 20px))
            rotate(360deg);
          opacity: 0;
        }
      }
    </style>
  </head>
  <body
    class="live-bg min-h-screen w-full flex items-center justify-center p-4 relative"
  >
    <!-- Ambient Glowing Bokeh Orbs -->
    <div
      class="bokeh-orb w-72 h-72 bg-pink-300 top-8 left-8"
      style="animation-delay: 0s"
    ></div>
    <div
      class="bokeh-orb w-96 h-96 bg-purple-300 bottom-8 right-8"
      style="animation-delay: -4s"
    ></div>
    <div
      class="bokeh-orb w-64 h-64 bg-sky-200 top-1/2 left-1/3"
      style="animation-delay: -8s"
    ></div>

    <!-- Floating Background Particles Layer (z-index: 1) -->
    <div id="bg-particles-layer"></div>

    <!-- 2. Centered Glassmorphism Card (z-index: 10 so burst emojis at z-5 appear right behind it) -->
    <main
      id="glass-card"
      class="relative z-10 w-11/12 max-w-md backdrop-blur-xl bg-white/35 border border-white/50 rounded-3xl shadow-2xl p-6 sm:p-8 flex flex-col items-center text-center mx-auto transition-all duration-300"
    >
      <!-- 3. Top: Sticker Container -->
      <div
        id="stickerContainer"
        class="w-36 h-36 sm:w-44 sm:h-44 mb-4 sm:mb-6 flex items-center justify-center sticker-bounce"
      >
        <!-- Initial Cute Blushing Bear Sticker -->

          <ellipse

          <!-- Big Puppy Eyes -->

          <!-- Pleading Eyebrows -->
          <path
            d="M58 80 Q70 73 82 82"
            stroke="#8C5327"
            stroke-width="3.5"
            fill="none"
            stroke-linecap="round"
          />
          <path
            d="M142 80 Q130 73 118 82"
            stroke="#8C5327"
            stroke-width="3.5"
            fill="none"
            stroke-linecap="round"
          />
          <!-- Snout & Nose -->
          <ellipse cx="100" cy="116" rx="22" ry="16" fill="#FFF3E6" />
          <ellipse cx="100" cy="110" rx="8" ry="5.5" fill="#4A2B18" />
          <!-- Cute Mouth -->
          <path
            d="M92 122 Q100 117 108 122"
            stroke="#4A2B18"
            stroke-width="3"
            fill="none"
            stroke-linecap="round"
          />
          <!-- Tiny Heart & Paws -->
          <path
            d="M100 165 C100 165 72 145 72 130 C72 120 84 116 93 124 C97 128 100 132 100 132 C100 132 103 128 107 124 C116 116 128 120 128 130 C128 145 100 165 100 165 Z"
            fill="#FF4D6D"
            stroke="#C9184A"
            stroke-width="3"
          />
          <circle
            cx="73"
            cy="145"
            r="14"
            fill="#E6AC78"
            stroke="#8C5327"
            stroke-width="3.5"
          />
          <circle
            cx="127"
            cy="145"
            r="14"
            fill="#E6AC78"
            stroke="#8C5327"
            stroke-width="3.5"
          />
        </svg>

        <!-- Sassy / Smug Cat Sticker with Sunglasses & Raised Eyebrow (Hidden initially) -->
        <svg
          id="sassy-sticker"
          viewBox="0 0 200 200"
          class="w-full h-full drop-shadow-xl hidden"
        >
          <!-- Sparkle Accents -->
          <path
            d="M28 38 L32 48 L42 52 L32 56 L28 66 L24 56 L14 52 L24 48 Z"
            fill="#FBBF24"
          />
          <path
            d="M174 30 L177 37 L184 40 L177 43 L174 50 L171 43 L164 40 L171 37 Z"
            fill="#F43F5E"
          />

          <!-- Cat Ears -->
          <polygon
            points="45,78 40,26 86,56"
            fill="#F8FAFC"
            stroke="#334155"
            stroke-width="4"
            stroke-linejoin="round"
          />
          <polygon points="52,70 49,39 76,58" fill="#FDA4AF" />
          <polygon
            points="155,78 160,26 114,56"
            fill="#F8FAFC"
            stroke="#334155"
            stroke-width="4"
            stroke-linejoin="round"
          />
          <polygon points="148,70 151,39 124,58" fill="#FDA4AF" />

          <!-- Sassy Body / Hands on Hips Pose -->
          <path
            d="M62 152 Q100 142 138 152 L146 186 Q100 194 54 186 Z"
            fill="#F43F5E"
            stroke="#334155"
            stroke-width="3.5"

          />
          <!-- Left Arm on Hip -->
          <path

          <circle

          />
          <!-- Right Arm on Hip -->
          <path
            d="M137 155 L162 168 L144 182"
            fill="none"
            stroke="#334155"
            stroke-width="5"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <circle
            cx="144"
            cy="182"
            r="8"
            fill="#F8FAFC"
            stroke="#334155"
            stroke-width="3"
          />

          <!-- Cat Head -->
          <ellipse
            cx="100"
            cy="102"
            rx="64"
            ry="52"
            fill="#F8FAFC"
            stroke="#334155"
            stroke-width="4"
          />

          <!-- Whiskers -->
          <line
            x1="26"
            y1="104"
            x2="46"
            y2="108"
            stroke="#64748B"
            stroke-width="2.5"
            stroke-linecap="round"
          />
          <line
            x1="26"
            y1="116"
            x2="46"
            y2="115"
            stroke="#64748B"
            stroke-width="2.5"
            stroke-linecap="round"
          />
          <line
            x1="174"
            y1="104"
            x2="154"
            y2="108"
            stroke="#64748B"
            stroke-width="2.5"
            stroke-linecap="round"
          />
          <line
            x1="174"
            y1="116"
            x2="154"
            y2="115"
            stroke="#64748B"
            stroke-width="2.5"
            stroke-linecap="round"
          />

          <!-- Sassy Raised Eyebrow -->
          <path
            d="M56 68 Q70 65 82 70"
            stroke="#1E293B"
            stroke-width="4"

          />
          <path
            d="M116 64 Q130 50 146 60"
            stroke="#1E293B"

          <!-- Cool Slanted Sunglasses -->
          <g transform="rotate(-3 100 92)">
            <!-- Left Lens -->
            <path
              d="M48 80 L94 80 L90 104 Q71 112 52 102 Z"
              fill="#0F172A"

              stroke-width="3"

            <!-- Right Lens -->
            <path

              stroke="#1E293B"
              stroke-width="3"
            />
            <!-- Bridge -->
            <path
              d="M94 83 Q100 79 106 83"
              stroke="#1E293B"
              stroke-width="4"
              fill="none"
            />
            <!-- Glossy Reflections -->
            <line
              x1="58"
              y1="84"
              x2="68"
              y2="100"
              stroke="#38BDF8"
              stroke-width="3"
              stroke-linecap="round"

            />
            <line
              x1="116"

              y2="100"
              stroke="#38BDF8"

              stroke-linecap="round"
              opacity="0.8"
            />
          </g>

          <!-- Pink Nose & Smug Smirk -->
          <polygon points="95,113 105,113 100,119" fill="#FB7185" />
          <path
            d="M86 126 Q102 133 119 120"
            stroke="#1E293B"
            stroke-width="3.5"
            fill="none"
            stroke-linecap="round"
          />
          <path
            d="M116 117 Q121 120 120 124"
            stroke="#1E293B"
            stroke-width="3"
            fill="none"
            stroke-linecap="round"
          />
        </svg>
      </div>

      <!-- 3. Middle: Message Text Area -->
      <div class="mb-6 sm:mb-8 px-1">
        <h1
          id="main-text"
          class="text-2xl sm:text-3xl font-extrabold text-slate-900 drop-shadow-sm leading-snug"
        >
          နင် ငါ့ကို ချစ်လား? 🥺
        </h1>
        <p
          id="sub-text"
          class="text-sm sm:text-base text-slate-700 font-semibold mt-2 transition-all duration-300"
        >
          အမှန်အတိုင်းလေး ရွေးပေးနော်... 💖
        </p>
      </div>

      <!-- 4. Bottom: Yes & No Buttons Area -->
      <div
        id="buttons-container"
        class="flex flex-wrap items-center justify-center gap-3 sm:gap-4 w-full min-h-[72px]"
      >
        <button
          id="yes-btn"
          class="bg-gradient-to-r from-rose-500 to-pink-500 text-white font-extrabold rounded-2xl px-7 py-3.5 text-lg sm:text-xl cursor-pointer active:scale-95"
        >
          Yes 💖
        </button>
        <button
          id="no-btn"
          class="bg-white/80 hover:bg-white text-slate-800 border border-white/70 font-bold rounded-2xl px-6 py-3.5 text-base sm:text-lg shadow-sm cursor-pointer active:scale-95"
        >
          No 😢
        </button>
      </div>
    </main>

    <script>
      // DOM References
      const yesBtn = document.getElementById("yes-btn");
      const noBtn = document.getElementById("no-btn");
      const buttonsContainer = document.getElementById("buttons-container");
      const mainText = document.getElementById("main-text");
      const subText = document.getElementById("sub-text");
      const stickerContainer = document.getElementById("stickerContainer");
      const cuteSticker = document.getElementById("cute-sticker");
      const sassySticker = document.getElementById("sassy-sticker");
      const bgParticlesLayer = document.getElementById("bg-particles-layer");

      // State Variables
      let noClickCount = 0;
      let isAccepted = false;

      // Pleading Burmese messages when clicking "No"
      const noMessages = [
        "သေချာလား? 😢",
        "ထပ်စဉ်းစားပါဦး 🥺",
        "မနှိပ်ပါနဲ့ဟာ 😭",
        "Yes ပဲ နှိပ်လိုက်ပါနော် 🙏",
        "နောက်ဆုံးအခွင့်အရေးနော်! 😤",
      ];

      // Background floating emojis (starts with hearts, switches to slay emojis on Yes)
      let currentBgEmojis = ["💖", "💕", "✨", "🌸"];

      // Handle "No" Button Click
      noBtn.addEventListener("click", () => {
        if (isAccepted) return;

        noClickCount++;

        // Trigger shake animation on No button
        noBtn.classList.remove("shake");
        void noBtn.offsetWidth; // Force reflow
        noBtn.classList.add("shake");

        // Step-by-step growth for the "Yes" button (using valid backticks)
        const fontSize = Math.min(18 + noClickCount * 5, 48);
        const padX = Math.min(28 + noClickCount * 10, 96);
        const padY = Math.min(14 + noClickCount * 6, 44);

        yesBtn.style.fontSize = `${fontSize}px`;
        yesBtn.style.paddingLeft = `${padX}px`;
        yesBtn.style.paddingRight = `${padX}px`;
        yesBtn.style.paddingTop = `${padY}px`;
        yesBtn.style.paddingBottom = `${padY}px`;

        // Update "No" button text and shrink slightly for clicks 1 through 5
        if (noClickCount <= noMessages.length) {
          noBtn.textContent = noMessages[noClickCount - 1];
          const noScale = Math.max(1 - noClickCount * 0.08, 0.65);
          noBtn.style.transform = `scale(${noScale})`;
        }

        // On the 6th click, make "No" disappear completely and expand "Yes" to full width
        if (noClickCount >= 6) {
          noBtn.style.display = "none";
          yesBtn.classList.add("w-full");
          yesBtn.textContent = "Yes ပဲ နှိပ်";
          //   subText.textContent = "ဟီးဟီး... No ခလုတ်လေး ပျောက်သွားပြီ 😜";
        }
      });

      // Handle "Yes" Button Click (Plot Twist!)
      yesBtn.addEventListener("click", () => {
        if (isAccepted) return;
        isAccepted = true;

        // 1. Switch to Sassy Cat Sticker
        cuteSticker.classList.add("hidden");
        sassySticker.classList.remove("hidden");
        stickerContainer.classList.remove("sticker-bounce");
        stickerContainer.classList.add("sticker-sassy");

        // 2. Update Text to Sassy Rejection Plot Twist
        mainText.textContent = "ငါတော့ နင့်ကို မချစ်ဘူး... ငြင်းတယ်! 💅";
        subText.textContent = "Haha! ";
        subText.classList.remove("text-slate-700");
        subText.classList.add(
          "text-rose-700",
          "font-bold",
          "text-base",
          "sm:text-lg",
        );

        // 3. Hide Buttons Container
        buttonsContainer.style.transition =
          "opacity 0.25s ease, transform 0.25s ease";
        buttonsContainer.style.opacity = "0";
        buttonsContainer.style.transform = "scale(0.9)";
        setTimeout(() => {
          buttonsContainer.style.display = "none";
        }, 250);

        // 4. Immediately switch floating background particles to Slay/Sassy emojis
        currentBgEmojis = ["💅", "😏", "😎", "✨", "👑", "🔥", "🤭"];
        // Clear existing heart particles immediately so zero hearts remain
        bgParticlesLayer.innerHTML = "";
        for (let i = 0; i < 14; i++) {
          spawnFloatingParticle(true);
        }

        // 5. Trigger Celebratory Burst of 35 Slay Emojis behind the glass card (z-index: 5)
        triggerSlayBurst();
      });

      // Function to spawn continuous floating background particles
      function spawnFloatingParticle(randomStartY = false) {
        const particle = document.createElement("div");
        particle.className = "floating-particle";
        particle.textContent =
          currentBgEmojis[Math.floor(Math.random() * currentBgEmojis.length)];

        const size = Math.random() * 14 + 16; // 16px to 30px
        const leftPos = Math.random() * 96; // 0% to 96%
        const duration = Math.random() * 5 + 6; // 6s to 11s
        const drift = (Math.random() - 0.5) * 80; // -40px to 40px

        particle.style.fontSize = `${size}px`;
        particle.style.left = `${leftPos}%`;
        particle.style.setProperty("--drift", `${drift}px`);
        particle.style.animationDuration = `${duration}s`;

        if (randomStartY) {
          particle.style.bottom = `${Math.random() * 80}%`;
        }

        bgParticlesLayer.appendChild(particle);

        setTimeout(() => {
          particle.remove();
        }, duration * 1000);
      }

      // Function to trigger 35 slay emojis exploding outward from behind the glass card (z-index: 5)
      function triggerSlayBurst() {
        const slayEmojis = ["💅", "😏", "😎", "✨", "👑", "🔥", "😜", "💁‍♀️"];

        for (let i = 0; i < 35; i++) {
          const burst = document.createElement("div");
          burst.textContent =
            slayEmojis[Math.floor(Math.random() * slayEmojis.length)];
          burst.style.position = "fixed";
          burst.style.left = "50%";
          burst.style.top = "50%";
          burst.style.fontSize = `${Math.random() * 20 + 22}px`;
          burst.style.pointerEvents = "none";
          burst.style.zIndex = "5"; // Behind glass card (z-10)
          burst.style.transform = "translate(-50%, -50%) scale(0.4)";
          burst.style.opacity = "1";
          burst.style.transition =
            "transform 1.25s cubic-bezier(0.16, 1, 0.3, 1), opacity 1.25s ease-out";

          document.body.appendChild(burst);

          const angle = Math.random() * Math.PI * 2;
          const distance = Math.random() * 260 + 90;
          const tx = Math.cos(angle) * distance;
          const ty = Math.sin(angle) * distance;
          const rotation = (Math.random() - 0.5) * 360;

          // Trigger smooth outward explosion on next frame
          requestAnimationFrame(() => {
            requestAnimationFrame(() => {
              burst.style.transform = `translate(calc(-50% + ${tx}px), calc(-50% + ${ty}px)) scale(1.25) rotate(${rotation}deg)`;
              burst.style.opacity = "0";
            });
          });

          setTimeout(() => {
            burst.remove();
          }, 1300);
        }
      }

      // Initialize background particle loop on window load
      window.onload = function () {
        for (let i = 0; i < 15; i++) {
          spawnFloatingParticle(true);
        }
        setInterval(() => {
          spawnFloatingParticle(false);
        }, 650);
      };
    </script>
  </body>
</html>
